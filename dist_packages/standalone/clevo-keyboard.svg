<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3248"/>
      <stop offset="100%" stop-color="#181a26"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#388bfd"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" filter="url(#drop)"/>

  <!-- Subtle Rim Highlight -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#4a5173" stroke-width="1.5" opacity="0.6"/>

  <!-- Laptop Keyboard Base -->
  <rect x="18" y="28" width="92" height="64" rx="8" fill="#12131c" stroke="#33374d" stroke-width="1.5"/>

  <!-- Key Matrix Rows -->
  <!-- Function Row -->
  <g fill="#212433">
    <rect x="23" y="33" width="10" height="7" rx="2"/>
    <rect x="36" y="33" width="10" height="7" rx="2"/>
    <rect x="49" y="33" width="10" height="7" rx="2"/>
    <rect x="62" y="33" width="10" height="7" rx="2"/>
    <rect x="75" y="33" width="10" height="7" rx="2"/>
    <rect x="88" y="33" width="17" height="7" rx="2"/>
  </g>

  <!-- Number Row -->
  <g fill="#212433">
    <rect x="23" y="43" width="12" height="9" rx="2.5"/>
    <rect x="38" y="43" width="10" height="9" rx="2.5"/>
    <rect x="51" y="43" width="10" height="9" rx="2.5"/>
    <rect x="64" y="43" width="10" height="9" rx="2.5"/>
    <rect x="77" y="43" width="10" height="9" rx="2.5"/>
    <rect x="90" y="43" width="15" height="9" rx="2.5"/>
  </g>

  <!-- QWERTY Row -->
  <g fill="#25293d">
    <rect x="23" y="55" width="14" height="9" rx="2.5"/>
    <rect x="40" y="55" width="10" height="9" rx="2.5"/>
    <rect x="53" y="55" width="10" height="9" rx="2.5"/>
    <rect x="66" y="55" width="10" height="9" rx="2.5"/>
    <rect x="79" y="55" width="10" height="9" rx="2.5"/>
    <rect x="92" y="55" width="13" height="9" rx="2.5"/>
  </g>

  <!-- Spacebar Row -->
  <g fill="#25293d">
    <rect x="23" y="67" width="16" height="9" rx="2.5"/>
    <rect x="42" y="67" width="44" height="9" rx="2.5" fill="#2d3248"/>
    <rect x="89" y="67" width="16" height="9" rx="2.5"/>
  </g>

  <!-- Accent Illumination Line (Underglow) -->
  <path d="M 23 83 L 105 83" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Trackpad -->
  <rect x="48" y="98" width="32" height="12" rx="3" fill="#1b1d2a" stroke="#2e334a" stroke-width="1"/>
</svg>
